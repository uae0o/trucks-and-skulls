workflows:
  ios-native:
    name: Trucks and Skulls Native iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Xcode Project via XcodeGen
        script: |
          set -e
          echo "Installing xcodegen..."
          brew install xcodegen
          
          echo "Generating Xcode project..."
          xcodegen generate
          
      - name: Build and Package IPA via Xcode
        script: |
          set -e
          echo "Compiling Trucks and Skulls native iOS binary..."
          xcodebuild \
            -project TrucksAndSkulls.xcodeproj \
            -scheme TrucksAndSkulls \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "build/derivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
            
          echo "Packaging into IPA..."
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r TrucksAndSkulls.ipa Payload
          cd ..
          echo "=== SUCCESS: TrucksAndSkulls.ipa is ready! ==="
    artifacts:
      - build/*.ipa
