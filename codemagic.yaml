workflows:
  unity-ios:
    name: Trucks and Skulls iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        BUNDLE_ID: "com.appyentertainment.trucksandskulls"
        XCODE_PROJECT: "build/iOS/Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Locate Unity and Execute Export
        script: |
          set -e
          echo "Scanning for Unity Editor on runner..."
          UNITY_BIN=$(find /Applications/Unity/Hub/Editor -name "Unity" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$UNITY_BIN" ]; then
            echo "Unity not found in default Hub path, searching /Applications..."
            UNITY_BIN=$(find /Applications -name "Unity" -type f -path "*/Contents/MacOS/*" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$UNITY_BIN" ]; then
            echo "Installing Unity 2021.3.38f1 via Unity Hub CLI..."
            /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install --version 2021.3.38f1
            UNITY_BIN=$(find /Applications/Unity/Hub/Editor -name "Unity" -type f 2>/dev/null | head -n 1)
          fi
          
          echo "Using Unity binary: $UNITY_BIN"
          
          "$UNITY_BIN" \
            -batchmode \
            -quit \
            -nographics \
            -logFile unity_build.log \
            -projectPath . \
            -executeMethod BuildScript.BuildIOS
            
          cat unity_build.log
      - name: Build IPA via Xcode
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.log"
